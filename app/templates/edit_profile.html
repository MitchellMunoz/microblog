{% extends "base.html" %}
{% import "bootstrap_wtf.html" as wtf %}

{% block content %}
    <h1>{{ _('Edit Profile') }}</h1>
<div class="mb-4">
    <img src="{{ url_for('static', filename='profile_pics/' + (current_user.photo or 'default.jpg')) }}"
         alt="Profile Picture" style="width:128px;height:128px;">
</div>
    <form method="post" enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        {{ wtf.quick_form(form) }}
    </form>
{% endblock %}
